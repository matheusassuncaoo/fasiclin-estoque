# Application Properties - Production Profile

# Server Configuration
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,application/javascript,application/json
server.http2.enabled=true

# Database Configuration (MySQL no Render ou outro serviço)
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/fasiclin_estoque?useSSL=true&requireSSL=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hikari Connection Pool (otimizado para produção)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Logging (produção)
logging.level.root=INFO
logging.level.com.br.fasipe.estoque=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# CORS Configuration (ajustar para domínio do Render)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,https://*.onrender.com}

# Security
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Actuator (health check)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true

# Cache
spring.cache.type=simple

# Application Info
spring.application.name=Fasiclin Estoque
info.app.name=Sistema de Gestão de Estoque - Fasiclin
info.app.version=1.0.0
info.app.description=Sistema de gerenciamento de ordens de compra e estoque
