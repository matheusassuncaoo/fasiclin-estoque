# ============================================
# Application Properties - Production (Render)
# ============================================

# Server Configuration
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,application/javascript,application/json
server.http2.enabled=true

# ============================================
# Database Configuration - Fasitech
# Configurar via Environment Variables no Render
# ============================================
spring.datasource.url=${DATABASE_URL:jdbc:mysql://160.20.22.99:3360/fasiclin?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8}
spring.datasource.username=${DATABASE_USERNAME:aluno4}
spring.datasource.password=${DATABASE_PASSWORD:OaAQLL+YVCU=}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hikari Connection Pool (LIMITE: 10 conexões por usuário no Fasitech)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.pool-name=RenderHikariPool
spring.datasource.hikari.leak-detection-threshold=60000

# JPA/Hibernate
# Usando 'none' porque o banco Fasitech é compartilhado e tem tipos de coluna diferentes
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Naming strategy
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# Logging (produção - menos verbose)
logging.level.root=INFO
logging.level.com.br.fasipe.estoque=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://*.onrender.com,http://localhost:5500,http://127.0.0.1:5500}

# Security
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Actuator (health check)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true

# Cache
spring.cache.type=simple

# Application Info
spring.application.name=Fasiclin Estoque
info.app.name=Sistema de Gestao de Estoque - Fasiclin
info.app.version=1.0.0
info.app.environment=Production (Render)

# Ordem Automática Configuration
ordem.automatica.enabled=${ORDEM_AUTOMATICA_ENABLED:true}
ordem.automatica.dias.entrega=${ORDEM_AUTOMATICA_DIAS_ENTREGA:7}

# Desabilitar lazy initialization em producao
spring.main.lazy-initialization=false
spring.jpa.open-in-view=false
spring.main.banner-mode=off

